<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>
    <style>
        body {
            background-color: #0b0b45;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(-135deg, #c850c0, #4158d0);
            padding: 30px;
            box-shadow: 0px 15px 20px rgba(255, 255, 255, 0.5);
            border-radius: 15px;
        }
        
        h1 {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 0;
            border-radius: 10px;
            position: relative;
        }
        
        .form-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
        }
        
        .pass-field {
            position: relative;
            margin-bottom: 25px;
            width: 100%;
        }
        
        .pass-field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .pass-field label {
            position: absolute;
            top: 12px;
            left: 15px;
            color: #999;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .pass-field input:focus + label,
        .pass-field input:valid + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            background: white;
            padding: 0 5px;
            color: #4158d0;
        }
        
        .btn {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(-135deg, #c850c0, #4158d0);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Change Password
        </h1>
        <div class="form-content">
            <div class="pass-field">
                <input type="password" required>
                <label>New Password</label>
            </div>
            <div class="pass-field">
                <input type="password" required>
                <label>Confirm Password</label>
            </div>
            <div class="btn">
                <button type="submit">Update Password</button>
            </div>
        </div>
    </div>
</body>
</html>
