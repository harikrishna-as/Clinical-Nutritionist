<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mr.Hari</title>
      <link rel="stylesheet" href="style1.css">
   </head>
   <style>
      @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap');
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

html, body {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  justify-content: center;
  align-items: center;
  background-color: #0b0b2d;
  overflow-x: hidden;
}

.minion-container {
  position: relative;
  width: 100px;
  height: 100px;
  margin-bottom: 30px;
  z-index: 10;
  top: 100px;
}

.minion {
  position: relative;
  height: 80px;
  width: 80px;
  top: 30px;
  left: -140px;
  transform: translateX(-50%);
}

.eye {
  position: relative;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: black;
  z-index: 200;
  transition: transform 0.1s ease;
}

.eye-left {
  top: -22%;
  left: -158%;
}

.eye-right {
  top: -32%;
  left: -132%;
}

.wrapper {
  width: 500px;
  max-width: 1000%;
  max-height: 100%;
  background: #ffffff;
  border-radius: 15px;
  box-shadow: 0px 15px 20px rgba(255, 255, 255, 0.5);
  margin-top: 30px;
  position: relative;
  top: -50px;
}

.wrapper .title {
  font-size: 35px;
  font-weight: 600;
  text-align: center;
  line-height: 100px;
  color: #fff;
  user-select: none;
  border-radius: 15px 15px 0 0;
  background: linear-gradient(-135deg, #0892d0, #4B0082);
}

.wrapper form {
  padding: 10px 30px 50px 30px;
}

.wrapper form .field {
  height: 50px;
  width: 100%;
  margin-top: 20px;
  position: relative;
}

.wrapper form .field input {
  height: 100%;
  width: 100%;
  outline: none;
  font-size: 17px;
  padding-left: 20px;
  border: 1px solid lightgrey;
  border-radius: 25px;
  transition: all 0.3s ease;
}

.wrapper form .field input:focus,
form .field input:valid {
  border-color: #4158d0;
}

.wrapper form .field label {
  position: absolute;
  top: 50%;
  left: 20px;
  color: #999999;
  font-weight: 400;
  font-size: 17px;
  pointer-events: none;
  transform: translateY(-50%);
  transition: all 0.3s ease;
}

form .field input:focus ~ label,
form .field input:valid ~ label {
  top: 0%;
  font-size: 16px;
  color: #4158d0;
  background: #fff;
  transform: translateY(-50%);
}

form .content {
  display: flex;
  width: 100%;
  height: 50px;
  font-size: 16px;
  align-items: center;
  justify-content: space-around;
}

form .content .checkbox {
  display: flex;
  align-items: center;
  justify-content: center;
}

form .content input {
  width: 15px;
  height: 15px;
  background: red;
}

form .content label {
  color: #262626;
  user-select: none;
  padding-left: 5px;
}

form .content .pass-link {
  color: "";
}

form .field input[type="submit"] {
  color: #fff;
  border: none;
  padding-left: 0;
  margin-top: -10px;
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  background: linear-gradient(-135deg, #0892d0, #4B0082);
  transition: all 0.3s ease;
}

form .field input[type="submit"]:active {
  transform: scale(0.95);
}

form .signup-link {
  color: #262626;
  margin-top: 20px;
  text-align: center;
}

form .pass-link a,
form .signup-link a {
  color: #4158d0;
  text-decoration: none;
}

form .pass-link a:hover,
form .signup-link a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  .wrapper .title {
    font-size: 25px;
    line-height: 80px;
  }
  
  .wrapper form {
    padding: 10px 20px 40px 20px;
  }
  
  h1 span {
    font-size: 35px;
  }
}
.no-select {
  user-select: none; 
  -webkit-user-select: none; 
  -moz-user-select: none; 
  -ms-user-select: none;
}
.loader-wrapper{
  width: 100px;
  height: 100px;
  position: relative;
  top: 0;
  left: 0;
  background-color: #0b0b2d;
}
#loader{
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 50;
  overflow: visible;
  background:  #0b0b2d url('i6.gif') no-repeat center center;
  scale: 1;
}

   </style>
   <body>
   <div class="no-select"></div>
   <div id="loader"></div>
   <div id="content"></div>
      <div class="minion-container">
        <img src="minion body.png" class="minion">
        <div class="eye eye-left"></div>
        <div class="eye eye-right"></div>
      </div>
      <div class="wrapper">
         <div class="title">
            Login
         </div>
         <form action="#">
            <div class="field">
               <input type="text" required>
               <label>Email Address</label>
            </div>
            <div class="field">
               <input type="password" required>
               <label>Password</label>
            </div>
            <div class="content">
               <div class="checkbox">
                  <input type="checkbox" id="remember-me">
                  <label for="remember-me">Remember me</label>
               </div>
               <div class="pass-link">
                  <a href="forgetpass.html">Forgot password?</a>
               </div>
            </div>
            <div class="field">
               <input type="submit" value="Login">
            </div>
            <div class="signup-link">
               Not a member? <a href="signup.html">Signup now</a>
            </div>
         </form>
      </div>
      </div>
   </div>
      <script src="script1.js"></script>
   </body>
   <script>
      document.addEventListener('mousemove', (e) => {
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    const eyes = document.querySelectorAll('.eye');
    
    // Check if the password field is in focus
    const passwordField = document.querySelector('input[type="password"]');
    const isPasswordFocused = document.activeElement === passwordField;
    
    if (isPasswordFocused) {
        // Both eyes look away (to the left) when password field is in focus
        eyes.forEach(eye => {
            // Make both eyes look to the left and slightly down
            eye.style.transform = `translate(-4px, -2px)`;
        });
    } else {
        // Normal eye tracking when password field is not in focus
        eyes.forEach(eye => {
            const eyeRect = eye.getBoundingClientRect();
            const eyeX = eyeRect.left + eyeRect.width / 2;
            const eyeY = eyeRect.top + eyeRect.height / 2;

            const dx = mouseX - eyeX;
            const dy = mouseY - eyeY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            const maxMovement = 3;
            const moveDistance = Math.min(maxMovement, distance);
            const angle = Math.atan2(dy, dx);

            const moveX = Math.cos(angle) * moveDistance;
            const moveY = Math.sin(angle) * moveDistance;

            eye.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    }
});

// Add event listeners for password field focus/blur
document.addEventListener('DOMContentLoaded', function() {
    const passwordField = document.querySelector('input[type="password"]');
    
    passwordField.addEventListener('focus', function() {
        // This will trigger the look-away behavior when focus occurs
    });
    
    passwordField.addEventListener('blur', function() {
        // This will allow eyes to return to normal when focus is lost
    });
});

// Loading animation code (unchanged)
var loader;
function loadNow(opacity){
    if(opacity<=0){
        displayContent();
    }
    else{
        loader.style.opacity = opacity;
        window.setTimeout(function(){
            loadNow(opacity - 0.5)
        },100);
    }
}
function displayContent(){
    loader.style.display = 'none';
    document.getElementById('content').style.display = 'block';
}
document.addEventListener("DOMContentLoaded",function(){
    loader = document.getElementById('loader');
    loadNow(0.1);
});
   </script>
</html>
